name: aethertune
description: Free and open-source music app with local playback and provider plugins.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audio_service: ^0.18.19
  audio_service_mpris:
    path: packages/audio_service_mpris
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_session: ^0.2.4
  file_picker: 12.2.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  collection: ^1.18.0
  crypto: ^3.0.7
  xml: ^7.0.1
  share_plus: ^13.3.0
  dynamic_color: ^2.1.0
  material_ui: ^1.1.1
  hotkey_manager: ^0.2.3
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  app_links: ^7.2.1
  smtc_windows: ^1.1.0
  url_launcher: ^6.3.1

  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_android 2.3.x introduces JNI, whose current Gradle project is
# incompatible with the Android build generated by Flutter stable in CI.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  generate: true
  uses-material-design: true
