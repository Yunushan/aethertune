services:
  aethertune-server:
    build: .
    ports:
      - "${AETHERTUNE_BIND_ADDRESS:-127.0.0.1}:${AETHERTUNE_PORT:-8080}:8080"
    environment:
      PORT: 8080
      AETHERTUNE_LISTEN_ADDRESS: "${AETHERTUNE_LISTEN_ADDRESS:-0.0.0.0}"
      AETHERTUNE_DATA_DIR: /data
      AETHERTUNE_SYNC_USERS: "${AETHERTUNE_SYNC_USERS:?Set AETHERTUNE_SYNC_USERS in .env}"
      AETHERTUNE_OPS_TOKEN: "${AETHERTUNE_OPS_TOKEN:?Set AETHERTUNE_OPS_TOKEN in .env}"
    volumes:
      - aethertune-server-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${AETHERTUNE_CPU_LIMIT:-1.0}"
          memory: "${AETHERTUNE_MEMORY_LIMIT:-256m}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/aethertune-healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  aethertune-server-data:
