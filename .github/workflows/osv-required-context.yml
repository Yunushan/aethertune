name: New OSV vulnerabilities and license violations

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  osv-scan:
    name: New OSV vulnerabilities and license violations / osv-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run scanner and verify evidence
        shell: bash
        env:
          OSV_SCAN_ARGS: |-
            -r
            ./
            --allow-no-lockfiles
            --licenses=0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,CC0-1.0,CDLA-Permissive-2.0,ISC,LGPL-2.1-only,LGPL-3.0-only,MIT,MPL-2.0,Unicode-3.0,Unicode-DFS-2016,Unlicense,Zlib,UNKNOWN
        run: python3 scripts/ci/run_osv_scan.py

      - name: Enforce vulnerability and license policy
        uses: google/osv-scanner-action/osv-reporter-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
