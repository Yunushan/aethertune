name: Container vulnerability scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 12 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fail-closed:
    name: Trivy container scan (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce container vulnerability policy
        run: >-
          python3 scripts/ci/scan_server_container.py
          --evidence build/container-scan

      - name: Upload container scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aethertune-container-scan-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: build/container-scan/

      - name: Upload Trivy scan results to code scanning
        if: ${{ always() && hashFiles('build/container-scan/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: build/container-scan/trivy.sarif
          category: server-container
