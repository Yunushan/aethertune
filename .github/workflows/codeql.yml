name: CodeQL analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 12 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze native platform code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        shell: bash
        run: bash scripts/ci/setup_flutter.sh

      - name: Generate platform wrappers and resolve dependencies
        shell: bash
        run: bash scripts/bootstrap_client.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build Android sources for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: cd apps/mobile && flutter build apk --debug --no-pub

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
