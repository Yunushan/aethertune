name: iOS native acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator:
    name: iOS Simulator startup persistence playback and TLS
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Flutter
        run: bash scripts/ci/setup_flutter.sh

      - name: Generate and verify platform wrappers
        run: bash scripts/bootstrap_client.sh

      - name: Test simulator fixture safety
        run: python3 scripts/ci/test_ios_native_acceptance.py

      - name: Execute isolated native iOS acceptance
        run: python3 scripts/ci/run_ios_native_acceptance.py --evidence build/ios-native-acceptance

      - name: Upload iOS acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aethertune-ios-native-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/ios-native-acceptance/*.json
            build/ios-native-acceptance/*.log
            build/ios-native-acceptance/*.png
