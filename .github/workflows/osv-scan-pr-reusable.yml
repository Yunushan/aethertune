name: Aethertune OSV pull request scan

on:
  workflow_call:
    inputs:
      scan-args:
        required: true
        type: string
      fail-on-vuln:
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: New OSV vulnerabilities and license violations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout target branch
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-}"
          if [[ -z "$base_ref" ]]; then
            base_ref="${{ github.event.merge_group.base_ref }}"
          fi
          if [[ -z "$base_ref" ]]; then
            echo "Unable to determine the merge target branch." >&2
            exit 1
          fi
          git checkout "$base_ref"
          git submodule update --recursive

      - name: Run scanner on existing code
        id: osv_scan_old
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            ${{ inputs.scan-args }}

      - name: Fail closed when base scanner crashes
        if: ${{ !cancelled() && steps.osv_scan_old.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s old-results.json ]] || ! python3 -c 'import json,sys; data=json.load(open("old-results.json", encoding="utf-8")); sys.exit(0 if isinstance(data, dict) and isinstance(data.get("results"), list) else 1)'; then
            echo "::error::OSV scanner exited nonzero without producing a parseable base results file. Failing closed instead of trusting a missing scan."
            exit 1
          fi
          echo "Scanner exited nonzero but produced a parseable base results file; the reporter enforces the vulnerability and license policy."

      - name: Checkout current branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -f "$GITHUB_SHA"
          git submodule update --recursive

      - name: Run scanner on new code
        id: osv_scan_new
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            ${{ inputs.scan-args }}

      - name: Fail closed when head scanner crashes
        if: ${{ !cancelled() && steps.osv_scan_new.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s new-results.json ]] || ! python3 -c 'import json,sys; data=json.load(open("new-results.json", encoding="utf-8")); sys.exit(0 if isinstance(data, dict) and isinstance(data.get("results"), list) else 1)'; then
            echo "::error::OSV scanner exited nonzero without producing a parseable head results file. Failing closed instead of trusting a missing scan."
            exit 1
          fi
          echo "Scanner exited nonzero but produced a parseable head results file; the reporter enforces the vulnerability and license policy."

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=${{ inputs.fail-on-vuln }}

      - name: Upload SARIF artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload old scan JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner old JSON results
          path: old-results.json
          retention-days: 5

      - name: Upload new scan JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner new JSON results
          path: new-results.json
          retention-days: 5

      - name: Error troubleshooter
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by an error during scanning earlier in the workflow."
          exit 1
