name: Aethertune OSV pull request scan

on:
  workflow_call:
    inputs:
      scan-args:
        required: true
        type: string
      fail-on-vuln:
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: New OSV vulnerabilities and license violations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve scanner policy across checkouts
        shell: bash
        run: |
          set -euo pipefail
          policy_dir="$(mktemp -d "$RUNNER_TEMP/aethertune-osv-policy.XXXXXX")"
          cp scripts/ci/run_osv_scan.py scripts/ci/verify_osv_scan.py "$policy_dir/"
          printf 'AETHERTUNE_OSV_POLICY_DIR=%s\n' "$policy_dir" >> "$GITHUB_ENV"

      - name: Checkout target branch
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-}"
          if [[ -z "$base_ref" ]]; then
            base_ref="${{ github.event.merge_group.base_ref }}"
          fi
          if [[ -z "$base_ref" ]]; then
            echo "Unable to determine the merge target branch." >&2
            exit 1
          fi
          git checkout "$base_ref"
          git submodule update --recursive

      - name: Run scanner on existing code and verify evidence
        shell: bash
        env:
          OSV_SCAN_ARGS: ${{ inputs.scan-args }}
          OSV_SCAN_OUTPUT: old-results.json
        run: |
          set -euo pipefail
          python3 "$AETHERTUNE_OSV_POLICY_DIR/run_osv_scan.py"
          mv old-results.json "$AETHERTUNE_OSV_POLICY_DIR/old-results.json"

      - name: Checkout current branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -f "$GITHUB_SHA"
          git submodule update --recursive

      - name: Run scanner on new code and verify evidence
        shell: bash
        env:
          OSV_SCAN_ARGS: ${{ inputs.scan-args }}
          OSV_SCAN_OUTPUT: new-results.json
        run: |
          set -euo pipefail
          # Remove checkout-seeded symlinks before restoring the reporter input.
          rm -f -- old-results.json
          cp "$AETHERTUNE_OSV_POLICY_DIR/old-results.json" old-results.json
          python3 "$AETHERTUNE_OSV_POLICY_DIR/run_osv_scan.py"

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=${{ inputs.fail-on-vuln }}

      - name: Upload SARIF artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload old scan JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner old JSON results
          path: old-results.json
          retention-days: 5

      - name: Upload new scan JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner new JSON results
          path: new-results.json
          retention-days: 5

      - name: Error troubleshooter
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by an error during scanning earlier in the workflow."
          exit 1
