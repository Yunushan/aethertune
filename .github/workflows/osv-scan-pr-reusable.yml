name: Aethertune OSV pull request scan

on:
  workflow_call:
    inputs:
      scan-args:
        required: true
        type: string
      fail-on-vuln:
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: New OSV vulnerabilities and license violations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout target branch
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-}"
          if [[ -z "$base_ref" ]]; then
            base_ref="${{ github.event.merge_group.base_ref }}"
          fi
          if [[ -z "$base_ref" ]]; then
            echo "Unable to determine the merge target branch." >&2
            exit 1
          fi
          git checkout "$base_ref"
          git submodule update --recursive

      - name: Run scanner on existing code
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            ${{ inputs.scan-args }}

      - name: Checkout current branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -f "$GITHUB_SHA"
          git submodule update --recursive

      - name: Run scanner on new code
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            ${{ inputs.scan-args }}

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=${{ inputs.fail-on-vuln }}

      - name: Upload SARIF artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload old scan JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner old JSON results
          path: old-results.json
          retention-days: 5

      - name: Upload new scan JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner new JSON results
          path: new-results.json
          retention-days: 5

      - name: Error troubleshooter
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by an error during scanning earlier in the workflow."
          exit 1
