version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /apps/mobile
      - /scripts/ci/library_storage_probe
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      flutter-client:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /services/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      dart-server:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /services/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: docker-compose
    directory: /services/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
