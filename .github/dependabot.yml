version: 2
updates:
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      flutter-client:
        dependency-type: production
    # flutter_localizations in the pinned Flutter 3.44.6 SDK requires intl 0.20.2.
    # Do not open updates that cannot resolve with the locked release toolchain.
    ignore:
      - dependency-name: intl
        versions:
          - ">=0.20.3"

  - package-ecosystem: pub
    directory: /services/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      dart-server:
        dependency-type: production

  - package-ecosystem: docker
    directory: /services/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: docker-compose
    directory: /services/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
